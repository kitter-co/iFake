<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iFake</title>
  </head>

  <body>
    <div id="settings-menu" class="hidden" style="display: none;">
      <h2 id="settings-header">
        Settings
        <button id="close-settings">Close</button>
      </h2>

      <form>
        <h3>Chord Display Settings</h3>
      </form>
    </div>

    <div id="keypad">
      <h2>Input Notes</h2>
    </div>
    <input type="text" id="input">
    <button id="go">
      Go
    </button>
    <output id="output"></output>

    <button id="sound-btn" type="button">
      Play Sound
    </button>


    <script src="./settings.js"></script>
    <script type="module" src="/shortcuts.js"></script>
    <script src="./chord_symbols.js"></script>
    <script type="module" src="./playback.js"></script>
    <script type="module" src="./sounds.js"></script>
  </body>
</html>
